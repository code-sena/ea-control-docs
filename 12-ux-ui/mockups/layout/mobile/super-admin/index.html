<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAirControl · Super administrador</title>
<link rel="stylesheet" href="../../../shared/mockup.css">
</head>
<body>
<div class="mobile-stage">
<div class="mobile-frame">
  <div class="m-topbar">☰ EduAirControl</div>
  <div class="m-content">

  <h1 class="m-h1">Super administrador</h1>
  <div class="chip-row"><span class="chip active">Instituciones</span><span class="chip">Usuarios</span></div>
  <div class="m-card"><div class="row-between"><b>SENA — Centro Industrial</b><button class="btn btn-ghost btn-sm">✎</button></div><p class="m-muted" style="margin-top:6px">3 sedes · 42 usuarios</p></div>
  <div class="m-card"><div class="row-between"><b>I.E. San José</b><button class="btn btn-ghost btn-sm">✎</button></div><p class="m-muted" style="margin-top:6px">2 sedes · 18 usuarios</p></div>
  <div class="m-card">
    <h2 class="h3">Usuario</h2>
    <div class="list-item"><div class="grow"><b>docente@sena.edu</b><p class="m-muted">SENA</p></div>
      <select class="select" style="width:120px"><option>USER</option><option>ADMIN</option></select></div>
    <div class="list-item"><div class="grow"><b>root@eduaircontrol.app</b><p class="m-muted">Todas</p></div>
      <select class="select" style="width:120px"><option>SUPER_ADMIN</option></select></div>
  </div>

  </div>
  <div class="m-tabs"><div class="m-tab"><span class="t-ico">⌂</span>Inicio</div><div class="m-tab"><span class="t-ico">♥</span>Favoritos</div><div class="m-tab"><span class="t-ico">⚙</span>Gestión</div><div class="m-tab"><span class="t-ico">🏢</span>Ambientes</div><div class="m-tab"><span class="t-ico">👤</span>Perfil</div></div>
</div>
</div>

</html>

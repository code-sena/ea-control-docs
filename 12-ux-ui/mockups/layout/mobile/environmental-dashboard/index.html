<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAirControl · Dashboard ambiental</title>
<link rel="stylesheet" href="../../../shared/mockup.css">
</head>
<body>
<div class="mobile-stage">
<div class="mobile-frame">
  <div class="m-topbar">☰ EduAirControl</div>
  <div class="m-content">

  <div class="row-between">
    <div><h1 class="m-h1">Panel ambiental</h1><p class="m-muted">Hoy · Sede Norte</p></div>
    <div class="icon-circ">🔔</div>
  </div>
  <div class="grid grid-2" style="gap:10px">
    <div class="m-card"><p class="m-muted">Calidad</p><p style="font-size:24px;font-weight:700" class="accent">87</p><span class="badge badge-normal">Buena</span></div>
    <div class="m-card"><p class="m-muted">CO₂</p><p style="font-size:24px;font-weight:700">612</p><span class="badge badge-normal">Normal</span></div>
    <div class="m-card"><p class="m-muted">Temperatura</p><p style="font-size:24px;font-weight:700">22.4°</p><span class="badge badge-normal">Confort</span></div>
    <div class="m-card"><p class="m-muted">Humedad</p><p style="font-size:24px;font-weight:700">48%</p><span class="badge badge-warning">Alta</span></div>
  </div>
  <div class="m-card"><h2 class="h3">Serie (24 h)</h2><div class="chart" style="height:110px;margin-top:8px"><div class="chart-line"></div></div></div>
  <div class="m-card"><h2 class="h3">Ambientes</h2>
    <div class="list-item"><span class="dot dot-normal"></span><div class="grow"><b>Aula 204</b><p class="m-muted">CO₂ 712 ppm</p></div></div>
    <div class="list-item"><span class="dot dot-warning"></span><div class="grow"><b>Lab 2</b><p class="m-muted">CO₂ 890 ppm</p></div></div>
  </div>

  </div>
  <div class="m-tabs"><div class="m-tab active"><span class="t-ico">⌂</span>Inicio</div><div class="m-tab"><span class="t-ico">♥</span>Favoritos</div><div class="m-tab"><span class="t-ico">⚙</span>Gestión</div><div class="m-tab"><span class="t-ico">🏢</span>Ambientes</div><div class="m-tab"><span class="t-ico">👤</span>Perfil</div></div>
</div>
</div>
</body>
</html>

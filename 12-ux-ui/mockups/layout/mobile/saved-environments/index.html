<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAirControl · Favoritos</title>
<link rel="stylesheet" href="../../../shared/mockup.css">
</head>
<body>
<div class="mobile-stage">
<div class="mobile-frame">
  <div class="m-topbar">☰ EduAirControl</div>
  <div class="m-content">

  <h1 class="m-h1">Mis favoritos</h1>
  <div class="m-card"><div class="row-between"><b>★ Aula 204</b><span class="badge badge-normal">Buena</span></div><p class="m-muted" style="margin-top:6px">CO₂ 712 ppm · 22.1 °C</p></div>
  <div class="m-card"><div class="row-between"><b>★ Lab 2</b><span class="badge badge-warning">Regular</span></div><p class="m-muted" style="margin-top:6px">CO₂ 890 ppm · 23.8 °C</p></div>
  <div class="m-card" style="text-align:center">
    <p class="small muted">¿Buscas más ambientes?</p>
    <button class="btn btn-outline btn-sm" style="margin-top:8px">Explorar ambientes</button>
  </div>

  </div>
  <div class="m-tabs"><div class="m-tab"><span class="t-ico">⌂</span>Inicio</div><div class="m-tab active"><span class="t-ico">♥</span>Favoritos</div><div class="m-tab"><span class="t-ico">⚙</span>Gestión</div><div class="m-tab"><span class="t-ico">🏢</span>Ambientes</div><div class="m-tab"><span class="t-ico">👤</span>Perfil</div></div>
</div>
</div>
</body>
</html>

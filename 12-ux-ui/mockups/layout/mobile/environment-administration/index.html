<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAirControl · Administración de ambientes</title>
<link rel="stylesheet" href="../../../shared/mockup.css">
</head>
<body>
<div class="mobile-stage">
<div class="mobile-frame">
  <div class="m-topbar">☰ EduAirControl</div>
  <div class="m-content">

  <div class="row-between">
    <h1 class="m-h1">Gestión</h1>
    <button class="btn btn-primary btn-sm">+ Nuevo</button>
  </div>
  <div class="chip-row"><span class="chip active">Ambientes</span><span class="chip">Sedes</span><span class="chip">Sensores</span></div>
  <div class="m-card"><div class="row-between"><b>Aula 204</b><div class="row"><button class="btn btn-ghost btn-sm">✎</button><button class="btn btn-ghost btn-sm">🗑</button></div></div><p class="m-muted" style="margin-top:6px">Sede Norte · 2 sensores</p></div>
  <div class="m-card"><div class="row-between"><b>Lab 2</b><div class="row"><button class="btn btn-ghost btn-sm">✎</button><button class="btn btn-ghost btn-sm">🗑</button></div></div><p class="m-muted" style="margin-top:6px">Sede Norte · 3 sensores</p></div>
  <button class="btn btn-outline">Provisionar sensor (BLE) →</button>

  </div>
  <div class="m-tabs"><div class="m-tab"><span class="t-ico">⌂</span>Inicio</div><div class="m-tab"><span class="t-ico">♥</span>Favoritos</div><div class="m-tab active"><span class="t-ico">⚙</span>Gestión</div><div class="m-tab"><span class="t-ico">🏢</span>Ambientes</div><div class="m-tab"><span class="t-ico">👤</span>Perfil</div></div>
</div>
</div>
</body>
</html>

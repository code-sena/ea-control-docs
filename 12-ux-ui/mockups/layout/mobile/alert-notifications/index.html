<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAirControl · Notificaciones</title>
<link rel="stylesheet" href="../../../shared/mockup.css">
</head>
<body>
<div class="mobile-stage">
<div class="mobile-frame">
  <div class="m-topbar">☰ EduAirControl</div>
  <div class="m-content">

  <div class="row-between">
    <h1 class="m-h1">Notificaciones</h1>
    <button class="btn btn-ghost btn-sm">✓ marcar leídas</button>
  </div>
  <div class="chip-row"><span class="chip active">Todas</span><span class="chip">No leídas</span></div>
  <div class="m-card"><div class="row"><span class="dot dot-alert"></span><div class="grow"><b>CO₂ alto — Aula 204</b><p class="m-muted">1120 ppm · hace 10 min</p></div></div></div>
  <div class="m-card"><div class="row"><span class="dot dot-warning"></span><div class="grow"><b>Humedad alta — Lab 2</b><p class="m-muted">62 % · hace 1 h</p></div></div></div>
  <div class="m-card"><div class="row"><span class="dot dot-normal"></span><div class="grow"><b>Calidad mejora — Biblioteca</b><p class="m-muted">09:15</p></div></div></div>
  <p class="m-muted" style="text-align:center">Toca una alerta para abrir el ambiente</p>

  </div>
  <div class="m-tabs"><div class="m-tab"><span class="t-ico">⌂</span>Inicio</div><div class="m-tab"><span class="t-ico">♥</span>Favoritos</div><div class="m-tab"><span class="t-ico">⚙</span>Gestión</div><div class="m-tab"><span class="t-ico">🏢</span>Ambientes</div><div class="m-tab"><span class="t-ico">👤</span>Perfil</div></div>
</div>
</div>
</body>
</html>

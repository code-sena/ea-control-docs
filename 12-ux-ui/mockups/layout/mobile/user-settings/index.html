<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAirControl · Configuración</title>
<link rel="stylesheet" href="../../../shared/mockup.css">
</head>
<body>
<div class="mobile-stage">
<div class="mobile-frame">
  <div class="m-topbar">☰ EduAirControl</div>
  <div class="m-content">

  <h1 class="m-h1">Configuración</h1>
  <div class="m-card">
    <h2 class="h3">Apariencia</h2>
    <div class="field" style="margin-top:8px"><label class="label">Tema</label>
      <div class="chip-row"><span class="chip active">Claro</span><span class="chip">Oscuro</span><span class="chip">Sistema</span></div></div>
    <div class="field" style="margin-top:10px"><label class="label">Idioma</label>
      <select class="select"><option>Español</option><option>English</option><option>Português</option><option>Français</option></select></div>
  </div>
  <div class="m-card">
    <h2 class="h3">Accesibilidad</h2>
    <div class="field" style="margin-top:8px"><label class="label">Texto</label>
      <div class="chip-row"><span class="chip active">16</span><span class="chip">18</span><span class="chip">20</span></div></div>
    <div class="field" style="margin-top:10px"><label class="label">Color</label>
      <div class="chip-row"><span class="chip active">Normal</span><span class="chip">Protanopia</span><span class="chip">Deuteranopia</span><span class="chip">Tritanopia</span></div></div>
  </div>
  <button class="btn btn-primary">Guardar</button>

  </div>
  <div class="m-tabs"><div class="m-tab"><span class="t-ico">⌂</span>Inicio</div><div class="m-tab"><span class="t-ico">♥</span>Favoritos</div><div class="m-tab"><span class="t-ico">⚙</span>Gestión</div><div class="m-tab"><span class="t-ico">🏢</span>Ambientes</div><div class="m-tab active"><span class="t-ico">👤</span>Perfil</div></div>
</div>
</div>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAirControl · Ambientes educativos</title>
<link rel="stylesheet" href="../../../shared/mockup.css">
</head>
<body>
<div class="mobile-stage">
<div class="mobile-frame">
  <div class="m-topbar">☰ EduAirControl</div>
  <div class="m-content">

  <h1 class="m-h1">Ambientes educativos</h1>
  <input class="input" placeholder="🔍  Buscar ambiente…">
  <div class="chip-row"><span class="chip active">Todas</span><span class="chip">Norte</span><span class="chip">Central</span></div>
  <div class="m-card"><div class="row-between"><b>Aula 204</b><span class="badge badge-normal">Buena</span></div><p class="m-muted" style="margin-top:6px">Sede Norte · CO₂ 712 ppm · 22.1 °C</p></div>
  <div class="m-card"><div class="row-between"><b>Lab 2</b><span class="badge badge-warning">Regular</span></div><p class="m-muted" style="margin-top:6px">Sede Norte · CO₂ 890 ppm · 23.8 °C</p></div>
  <div class="m-card"><div class="row-between"><b>Biblioteca</b><span class="badge badge-normal">Buena</span></div><p class="m-muted" style="margin-top:6px">Sede Central · CO₂ 540 ppm · 21.5 °C</p></div>

  </div>
  <div class="m-tabs"><div class="m-tab"><span class="t-ico">⌂</span>Inicio</div><div class="m-tab"><span class="t-ico">♥</span>Favoritos</div><div class="m-tab"><span class="t-ico">⚙</span>Gestión</div><div class="m-tab active"><span class="t-ico">🏢</span>Ambientes</div><div class="m-tab"><span class="t-ico">👤</span>Perfil</div></div>
</div>
</div>
</body>
</html>

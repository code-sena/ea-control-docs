<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAirControl · Autenticación</title>
<link rel="stylesheet" href="../../../shared/mockup.css">
</head>
<body>
<div class="mobile-stage">
<div class="mobile-frame">
  <div class="m-topbar">☰ EduAirControl</div>
  <div class="m-content">

  <div class="m-card" style="text-align:center">
    <div class="brand" style="justify-content:center"><div class="brand-badge">EA</div> EduAirControl</div>
    <p class="m-muted" style="margin-top:8px">Inicia sesión para continuar</p>
  </div>
  <div class="m-card">
    <div class="col">
      <div class="field"><label class="label">Correo</label><input class="input" placeholder="usuario@institucion.edu"></div>
      <div class="field"><label class="label">Contraseña</label><input class="input" type="password" placeholder="••••••••"></div>
      <a class="small accent" style="text-align:right">¿Olvidaste tu contraseña?</a>
      <button class="btn btn-primary">Iniciar sesión</button>
      <button class="btn btn-outline">Continuar con Google</button>
      <p class="small muted" style="text-align:center">¿No tienes cuenta? <a class="accent">Regístrate</a></p>
    </div>
  </div>
  <p class="m-muted" style="text-align:center">Stack: Login · SignUp · ForgotPassword · VerifyCode · ChangePassword · Terms · Guide</p>

  </div>
  <div class="m-tabs"><div class="m-tab"><span class="t-ico">⌂</span>Inicio</div><div class="m-tab"><span class="t-ico">♥</span>Favoritos</div><div class="m-tab"><span class="t-ico">⚙</span>Gestión</div><div class="m-tab"><span class="t-ico">🏢</span>Ambientes</div><div class="m-tab"><span class="t-ico">👤</span>Perfil</div></div>
</div>
</div>
</body>
</html>

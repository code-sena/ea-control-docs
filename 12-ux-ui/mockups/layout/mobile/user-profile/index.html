<!doctype html>
<html lang="es">
<head>

<link rel="stylesheet" href="../../../shared/mockup.css">
</head>
<body>
<div class="mobile-stage">
<div class="mobile-frame">
  <div class="m-topbar">☰ EduAirControl</div>

  <div class="m-card" style="text-align:center">
    <div class="avatar" style="width:72px;height:72px;font-size:24px;margin:0 auto 10px">MC</div>
    <b>María C. Olaya</b>
    <p class="m-muted">Docente · SENA</p>
    <span class="badge badge-accent">USER</span>
  </div>
  <div class="m-card">
    <div class="field"><label class="label">Nombre</label><input class="input" value="María C. Olaya"></div>
    <div class="field" style="margin-top:10px"><label class="label">Correo</label><input class="input" value="docente@sena.edu" disabled></div>
    <button class="btn btn-primary" style="margin-top:12px;width:100%">Guardar cambios</button>
  </div>
  <button class="btn btn-outline">Cambiar contraseña</button>

  </div>
  <div class="m-tabs"><div class="m-tab"><span class="t-ico">⌂</span>Inicio</div><div class="m-tab"><span class="t-ico">♥</span>Favoritos</div><div class="m-tab"><span class="t-ico">⚙</span>Gestión</div><div class="m-tab"><span class="t-ico">🏢</span>Ambientes</div><div class="m-tab active"><span class="t-ico">👤</span>Perfil</div></div>
</div>
</div>

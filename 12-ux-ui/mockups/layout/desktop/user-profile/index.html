<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAirControl · Perfil de usuario</title>
<link rel="stylesheet" href="../../../shared/mockup.css">
</head>
<body>
<div class="page">
<header class="nav"><div class="container nav-inner">
  <div class="brand"><div class="brand-badge">EA</div> EduAirControl</div>
  <nav class="nav-links"><a class="nav-link" href="/dashboard">Dashboard</a><a class="nav-link" href="/all-environments">Ambientes</a><a class="nav-link" href="/management">Gestión</a></nav>
  <div class="nav-actions">
    <button class="btn btn-ghost btn-sm">🔔</button>
    <button class="btn btn-outline btn-sm">Mi perfil</button>
    <button class="btn btn-primary btn-sm">Salir</button>
  </div>
</div></header>
<main class="main"><div class="container">

<h1 class="h1" style="margin-bottom:18px">Mi perfil</h1>
<div class="grid" style="grid-template-columns:1fr 1.4fr">
  <section class="card" style="text-align:center">
    <div class="avatar" style="width:96px;height:96px;font-size:32px;margin:0 auto 12px">MC</div>
    <b>María C. Olaya</b>
    <p class="small muted">Docente · SENA — Centro Industrial</p>
    <span class="badge badge-accent" style="margin-top:10px">USER</span>
  </section>
  <section class="card">
    <h2 class="section-title">Información personal</h2>
    <div class="grid grid-2">
      <div class="field"><label class="label">Nombre</label><input class="input" value="María C. Olaya"></div>
      <div class="field"><label class="label">Correo</label><input class="input" value="docente@sena.edu" disabled></div>
      <div class="field"><label class="label">Institución</label><input class="input" value="SENA — Centro Industrial" disabled></div>
      <div class="field"><label class="label">Sede</label><input class="input" value="Sede Norte" disabled></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn btn-primary">Guardar cambios</button>
      <button class="btn btn-outline">Cambiar contraseña</button>
      <button class="btn btn-ghost">Cerrar sesiones</button>
    </div>
  </section>
</div>

</div></main>
<footer class="footer"><div class="container">© EduAirControl · Mockup de interfaz · tokens v1</div></footer>
</div>
</body>
</html>

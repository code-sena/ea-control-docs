<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAirControl · Configuración</title>
<link rel="stylesheet" href="../../../shared/mockup.css">
</head>
<body>
<div class="page">
<header class="nav"><div class="container nav-inner">
  <div class="brand"><div class="brand-badge">EA</div> EduAirControl</div>
  <nav class="nav-links"><a class="nav-link" href="/dashboard">Dashboard</a><a class="nav-link" href="/all-environments">Ambientes</a><a class="nav-link" href="/management">Gestión</a></nav>
  <div class="nav-actions">
    <button class="btn btn-ghost btn-sm">🔔</button>
    <button class="btn btn-outline btn-sm">Mi perfil</button>
    <button class="btn btn-primary btn-sm">Salir</button>
  </div>
</div></header>
<main class="main"><div class="container">

<h1 class="h1" style="margin-bottom:18px">Configuración</h1>
<div class="grid grid-2">
  <section class="card">
    <h2 class="section-title">Apariencia</h2>
    <div class="col">
      <div class="field"><label class="label">Tema</label>
        <div class="chip-row"><span class="chip active">Claro</span><span class="chip">Oscuro</span><span class="chip">Sistema</span></div>
      </div>
      <div class="field"><label class="label">Idioma</label>
        <select class="select"><option>Español</option><option>English</option><option>Português</option><option>Français</option></select>
      </div>
    </div>
  </section>
  <section class="card">
    <h2 class="section-title">Accesibilidad</h2>
    <div class="col">
      <div class="field"><label class="label">Tamaño de texto</label>
        <div class="chip-row"><span class="chip active">16 px</span><span class="chip">18 px</span><span class="chip">20 px</span></div>
      </div>
      <div class="field"><label class="label">Perfil de color</label>
        <div class="chip-row"><span class="chip active">Normal</span><span class="chip">Protanopia</span><span class="chip">Deuteranopia</span><span class="chip">Tritanopia</span></div>
      </div>
    </div>
  </section>
  <section class="card">
    <h2 class="section-title">Preferencias</h2>
    <div class="col">
      <label class="row"><input type="checkbox" checked> Notificaciones de alertas</label>
      <label class="row"><input type="checkbox" checked> Resumen diario por correo</label>
      <div class="field"><label class="label">Zona horaria</label><select class="select"><option>América/Bogotá</option></select></div>
    </div>
  </section>
  <section class="card" style="display:flex;align-items:flex-end">
    <button class="btn btn-primary btn-lg">Guardar configuración</button>
  </section>
</div>

</div></main>
<footer class="footer"><div class="container">© EduAirControl · Mockup de interfaz · tokens v1</div></footer>
</div>
</body>
</html>
